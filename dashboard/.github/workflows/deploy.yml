name: Deploy NSE OI Dashboard

# Deploy ONLY when dashboard source code changes.
# CSV data updates do NOT require a redeploy — the browser fetches the
# latest nse_oi_dashboard.csv from GitHub raw URL on every page visit.
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: ./dashboard
        run: npm ci

      - name: Build
        working-directory: ./dashboard
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
